# A plain client-side-routed SPA: every unknown path falls back to index.html so
# react-router-dom (BrowserRouter) handles routing instead of nginx 404ing direct loads of
# e.g. /roster/member/123.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
